server {
    listen 5500;
    server_name dev.workroom.everypixel.com workroom.everypixel.com nikita.workroom.everypixel.com;
    client_max_body_size 100M;

    port_in_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    error_log /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log combined;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Document-Policy "js-profiling" always;

    # Pre-rendered routes
    location ~ ^/signin/?$ {
        rewrite ^ /signin/index.html last;
    }
    location ~ ^/signup/?$ {
        rewrite ^ /signup/index.html last;
    }
    location ~ ^/recover-password/?$ {
        rewrite ^ /recover-password/index.html last;
    }
    location ~ ^/users/confirmation/password/?$ {
        rewrite ^ /users/confirmation/password/index.html last;
    }
    location ~ ^/users/confirmation/email/?$ {
        rewrite ^ /users/confirmation/email/index.html last;
    }

    # HTML — no cache
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Service worker — no cache
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # All hashed assets — immutable forever
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html { internal; }
}
